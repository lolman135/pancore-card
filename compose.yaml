services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: pancore-backend-${ENV:-main}
    env_file:
      - .env
    restart: always
    networks:
      - inner-network

  nginx:
    image: ${FRONTEND_IMAGE}
    container_name: pancore-nginx-${ENV:-main}
    env_file:
      - .env
    ports:
      - '${NGINX_PORT:-80}:80'
      - '443:443'
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - API_KEY=${API_KEY}
      - NGINX_ENVSUBST_FILTER=BACKEND_PORT|API_KEY
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - inner-network
    depends_on:
      - backend

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: pancore-umami
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
    depends_on:
      - umami-db
    restart: always
    networks:
      - inner-network
    mem_limit: 400m

  umami-db:
    image: postgres:16-alpine
    container_name: pancore-umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes: [ "umami-db:/var/lib/postgresql/data" ]
    restart: always
    networks:
      - inner-network
    mem_limit: 200m

networks:
  inner-network:
    driver: bridge

volumes:
  umami-db: