name: deploy-website.yaml
on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Get Code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pancore/backend:latest
            ghcr.io/${{ github.repository_owner }}/pancore/backend:${{ github.run_number }}

  build-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Get Code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pancore/frontend:latest
            ghcr.io/${{ github.repository_owner }}/pancore/frontend:${{ github.run_number }}
            
  
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Get Code
        uses: actions/checkout@v6

      - name: Prepare Deploy Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ~/pancore

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.yaml
          target: ~/pancore

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/pancore
            cat > .env <<'ENVFILE'
            BACKEND_PORT=8080
            BACKEND_HOST=0.0.0.0
            NGINX_PORT=80
            API_KEY=${{ secrets.API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_TO=${{ secrets.MAIL_TO }}
            MAIL_FROM_PASSWORD=${{ secrets.MAIL_FROM_PASSWORD }}
            PROD_FLAG=${{ vars.PROD_FLAG }}
            ENVFILE
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/pancore/backend:${{ github.run_number }} \
            FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/pancore/frontend:${{ github.run_number }} \
            docker compose up -d --pull always
            docker image prune -f
