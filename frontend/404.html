<meta charset="UTF-8">
<script>
  /* Мова сторінки → <html lang> синхронно, до запуску модулів (усі скрипти й словник i18n
     читають саме його). Пріоритет: ?lang=uk|en|pl (зберігається) → збережений вибір
     (localStorage + cookie pancore-lang) → мова системи: uk/ru → uk, pl → pl, інші → en. */
  (function () {
    var OK = /^(uk|en|pl)$/, l = null;
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var c = (document.cookie.match(/(?:^|;\s*)pancore-lang=(\w+)/) || [])[1];
      var s = null;
      try { s = localStorage.getItem('pancore-lang'); } catch (e) { /* приватний режим */ }
      l = OK.test(q) ? q : OK.test(s) ? s : OK.test(c) ? c : null;
      if (l && (q || !s || !c)) {
        try { localStorage.setItem('pancore-lang', l); } catch (e) { /* приватний режим */ }
        document.cookie = 'pancore-lang=' + l + '; path=/; max-age=31536000; SameSite=Lax';
      }
    } catch (e) { /* без сховища — визначаємо за системою */ }
    if (!l) {
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
      var sys = String(langs[0] || '').slice(0, 2).toLowerCase();
      l = (sys === 'uk' || sys === 'ru') ? 'uk' : sys === 'pl' ? 'pl' : 'en';
    }
    document.documentElement.lang = l;
  })();
</script>
