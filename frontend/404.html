<script>
  /* Мова сторінки: ?lang=uk|en|pl (зберігається) або збережений вибір → <html lang>
     синхронно, до запуску модулів: усі скрипти й словник i18n читають саме його. */
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q) localStorage.setItem('pancore-lang', q);
      var l = q || localStorage.getItem('pancore-lang');
      if (/^(uk|en|pl)$/.test(l)) document.documentElement.lang = l;
    } catch (e) { /* без localStorage — мова за замовчуванням */ }
  })();
</script>
